name = "probstreet-notification-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[queues.consumers]]
queue = "notification-queue"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 2


[vars]
FRONTEND_URL = "localhost:5271"
STREAM_SERVICE_URL = "localhost:1000"

[observability.logs]
enabled = true
